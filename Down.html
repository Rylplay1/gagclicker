<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Taken down</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1f2937, #000000);
        }
        @keyframes pulse-once {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-once-animation {
            animation: pulse-once 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="gradient-bg flex items-center justify-center min-h-screen text-white p-4">
    <div class="bg-gray-800 bg-opacity-70 backdrop-blur-lg rounded-3xl p-8 sm:p-12 text-center max-w-lg w-full shadow-2xl">
        <!-- Maintenance Icon -->
        <div class="mb-6">
            <svg class="h-16 w-16 mx-auto text-gray-400 pulse-once-animation" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <!-- Main Title -->
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-4">
            We'll be right back!
        </h1>

        <!-- Subheading -->
        <h2 class="text-xl sm:text-2xl text-gray-300 font-semibold mb-6">
            Our website is currently undergoing urgent maintenance.
        </h2>

        <!-- Rephrased Body Text -->
        <p class="text-gray-400 leading-relaxed text-sm sm:text-base mb-8">
            We're working hard to address a critical issue and apologize for any inconvenience. We appreciate your patience and look forward to welcoming you back online.
        </p>

        <!-- Specific Date -->
        <div class="bg-gray-700 bg-opacity-50 inline-block px-6 py-3 rounded-full text-lg font-bold text-yellow-300 shadow-md">
            Coming back on --/--/--
        </div>

        <!-- Signature/Attribution -->
        <p class="text-gray-500 text-xs mt-8">
            By RYL
        </p>
    </div>
</body>
</html>
